[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saakshya"
version = "0.1.0"
description = "Lawful public-source OSINT research engine for Indian phone numbers with evidence, provenance, entity resolution and confidence scoring."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "phonenumbers>=9.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "networkx>=3.2",
  "jinja2>=3.1",
  "typer>=0.12",
  "rich>=13.7",
  "tenacity>=8.2",
  "pypdf>=4.2",
  "tldextract>=5.1",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35", "pyvis>=0.3.2", "pandas>=2.2"]
pdf = ["weasyprint>=62"]
docs = ["python-docx>=1.1", "openpyxl>=3.1", "pdfplumber>=0.11"]
username = ["maigret>=0.4.4"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.4", "mypy>=1.10"]

[tool.setuptools]
packages = ["config", "core", "providers", "providers.search", "providers.phone", "providers.social",
            "providers.business", "providers.documents", "providers.username", "providers.image",
            "providers.registry", "collectors", "extractors", "correlation", "scoring", "reports", "storage", "ui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
